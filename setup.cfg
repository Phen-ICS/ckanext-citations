[extract_messages]
keywords = translate isPlural
add_comments = TRANSLATORS:
output_file = ckanext/citations/i18n/ckanext-citations.pot
width = 80

[init_catalog]
domain = ckanext-citations
input_file = ckanext/citations/i18n/ckanext-citations.pot
output_dir = ckanext/citations/i18n

[update_catalog]
domain = ckanext-citations
input_file = ckanext/citations/i18n/ckanext-citations.pot
output_dir = ckanext/citations/i18n
previous = true

[compile_catalog]
domain = ckanext-citations
directory = ckanext/citations/i18n
statistics = true
